SectionVerb {
 EnableSequence [ disdevall "" ]
}
SectionDevice."Speaker" {
 Comment "Internal speakers"
 ConflictingDevice [ "Headphones" ]
 EnableSequence [ cset "name='Speaker Switch' on" ]
 DisableSequence [ cset "name='Speaker Switch' off" ]
 Value { PlaybackPCM "hw:${CardId},0" PlaybackPriority 100 PlaybackMixerElem "DAC" }
}
SectionDevice."Headphones" {
 Comment "Headphones"
 ConflictingDevice [ "Speaker" ]
 EnableSequence [ cset "name='Headphone Switch' on" ]
 DisableSequence [ cset "name='Headphone Switch' off" ]
 Value { PlaybackPCM "hw:${CardId},0" PlaybackPriority 200 PlaybackMixerElem "DAC" JackControl "Headphone Jack" JackHWMute "Speaker" }
}
SectionDevice."Mic" {
 Comment "Internal microphone"
 ConflictingDevice [ "Headset" ]
 EnableSequence [ cset "name='Internal Mic Switch' on" ]
 DisableSequence [ cset "name='Internal Mic Switch' off" ]
 Value { CapturePCM "hw:${CardId},0" CapturePriority 100 CaptureMixerElem "ADC" }
}
SectionDevice."Headset" {
 Comment "Headset microphone"
 ConflictingDevice [ "Mic" ]
 EnableSequence [ cset "name='Headset Mic Switch' on" ]
 DisableSequence [ cset "name='Headset Mic Switch' off" ]
 Value { CapturePCM "hw:${CardId},0" CapturePriority 200 CaptureMixerElem "ADC" JackControl "Headset Mic Jack" }
}
Include.hdmi.File "/Intel/sof-essx8336/Hdmi.conf"
